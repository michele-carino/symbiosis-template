name: Sync Governance to .github

on:
  push:
    branches:
      - main
    paths:
      - 'GOVERNANCE.md'

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run link fixer script
        run: |
          python3 .github/scripts/fix_links.py GOVERNANCE.md .github/README.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync and fix generic links for README.md [skip ci]" && git push)