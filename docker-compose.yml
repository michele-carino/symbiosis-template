services:
  ollama:
    build:
      context: ./Dockerfile.d/ollama
      args:
        - OLLAMA_PORT=${OLLAMA_PORT}
        - OLLAMA_BASE_IMAGE=ollama/ollama:latest
    container_name: symbiosis_ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:${OLLAMA_PORT}"
    environment:
      - OLLAMA_HOST=0.0.0.0:${OLLAMA_PORT}
    volumes:
      - symbiosis_ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: symbiosis_ollama_webui
    ports:
      - "127.0.0.1:3000:${WEBUI_PORT}"
    environment:
      - OLLAMA_BASE_URL=http://ollama:${OLLAMA_PORT}
      - PORT=${WEBUI_PORT}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME}
    volumes:
      - symbiosis_ollama_webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBUI_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Installs models
  ollama-init:
    build:
      context: ./Dockerfile.d/ollama-init
      dockerfile: Dockerfile
      target: cpu
    container_name: symbiosis_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_PORT=${OLLAMA_PORT}
    profiles:
      - manual
    volumes:
      - ./Dockerfile.d/ollama-init/output:/output
    restart: "no"

volumes:
  symbiosis_ollama_data:
  symbiosis_ollama_webui_data: